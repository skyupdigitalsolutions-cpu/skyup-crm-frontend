<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- FIX (stale favicon after updates): browsers cache favicons unusually
         aggressively, keyed on the exact URL — often ignoring even a hard
         refresh. Overwriting the same filename's content, as before, meant
         updates could go unnoticed for a long time. Appending a version
         query string means the URL itself changes whenever this is bumped,
         which forces browsers to fetch fresh — no user action needed. Bump
         this number (?v=2 → ?v=3 etc.) any time the favicon file changes. -->
    <link rel="icon" type="image/svg+xml" href="/skyup_logo1.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Poppins — referenced via Tailwind's font-poppins / fontFamily.poppins.
         Without this the font-poppins class silently fell back to system sans. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved theme BEFORE first paint so light-mode users don't get a
         flash of dark (the page was previously hardcoded class="dark"). -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>

    <title>skyup-crm</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
